{% extends "base.html" %}
{% block title %}{{ 'Edit' if customer else 'Add' }} Customer - MotoSpareParts ERP{% endblock %}
{% block content %}
<h2 class="mb-4">{{ 'Edit' if customer else 'Add' }} Customer</h2>
<form method="post" class="card p-4">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label">Name</label>
      <input type="text" name="name" class="form-control" required value="{{ customer.name if customer else '' }}">
    </div>
    <div class="col-md-6">
      <label class="form-label">Phone</label>
      <input type="text" name="phone" class="form-control" value="{{ customer.phone if customer else '' }}">
    </div>
    <div class="col-md-6">
      <label class="form-label">Vehicle Model</label>
      <input type="text" name="vehicle_model" class="form-control" value="{{ customer.vehicle_model if customer else '' }}">
    </div>
    <div class="col-md-12">
      <label class="form-label">Address</label>
      <textarea name="address" class="form-control">{{ customer.address if customer else '' }}</textarea>
    </div>
  </div>
  <div class="mt-4 d-flex gap-2">
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{{ url_for('customers.list_customers') }}" class="btn btn-outline-secondary">Cancel</a>
  </div>
</form>
{% endblock %}
