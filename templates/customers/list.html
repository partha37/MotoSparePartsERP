{% extends "base.html" %}
{% block title %}Customers - MotoSpareParts ERP{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Customers</h2>
  <a href="{{ url_for('customers.new_customer') }}" class="btn btn-primary">+ Add Customer</a>
</div>
<div class="card p-3">
<table class="table table-hover align-middle">
  <thead><tr><th>Name</th><th>Phone</th><th>Vehicle Model</th><th></th></tr></thead>
  <tbody>
    {% for c in customers %}
    <tr>
      <td><a href="{{ url_for('customers.view_customer', customer_id=c.id) }}">{{ c.name }}</a></td>
      <td>{{ c.phone }}</td>
      <td>{{ c.vehicle_model }}</td>
      <td class="text-end">
        <a href="{{ url_for('customers.edit_customer', customer_id=c.id) }}" class="btn btn-sm btn-outline-secondary">Edit</a>
        <form method="post" action="{{ url_for('customers.delete_customer', customer_id=c.id) }}" class="d-inline" onsubmit="return confirm('Delete this customer?');">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
        </form>
      </td>
    </tr>
    {% else %}
    <tr><td colspan="4" class="text-center text-muted">No customers yet.</td></tr>
    {% endfor %}
  </tbody>
</table>
</div>
{% endblock %}
