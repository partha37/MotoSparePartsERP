{% extends "base.html" %}
{% block title %}{{ 'Edit' if mechanic else 'Add' }} Mechanic - MotoSpareParts ERP{% endblock %}
{% block content %}
<h2 class="mb-4">{{ 'Edit' if mechanic else 'Add' }} Mechanic</h2>
<form method="post" class="card p-4">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label">Name</label>
      <input type="text" name="name" class="form-control" required value="{{ mechanic.name if mechanic else '' }}">
    </div>
    <div class="col-md-6">
      <label class="form-label">Garage Name</label>
      <input type="text" name="garage_name" class="form-control" value="{{ mechanic.garage_name if mechanic else '' }}">
    </div>
    <div class="col-md-6">
      <label class="form-label">Phone</label>
      <input type="text" name="phone" class="form-control" value="{{ mechanic.phone if mechanic else '' }}">
    </div>
    <div class="col-md-6">
      <label class="form-label">Commission %</label>
      <input type="number" step="0.01" name="commission_pct" class="form-control" value="{{ mechanic.commission_pct if mechanic else 0 }}">
    </div>
  </div>
  <div class="mt-4 d-flex gap-2">
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{{ url_for('mechanics.list_mechanics') }}" class="btn btn-outline-secondary">Cancel</a>
  </div>
</form>
{% endblock %}
