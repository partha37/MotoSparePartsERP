{% extends "base.html" %}
{% block title %}New Purchase - MotoSpareParts ERP{% endblock %}
{% block content %}
<h2 class="mb-4">New Purchase (Stock In)</h2>

<form method="post" class="card p-4">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="row g-3 mb-3">
    <div class="col-md-4">
      <label class="form-label">Supplier</label>
      <select name="supplier_id" class="form-select" required>
        <option value="">-- Select Supplier --</option>
        {% for s in suppliers %}
        <option value="{{ s.id }}">{{ s.name }} {{ '(' + s.brand + ')' if s.brand else '' }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-3">
      <label class="form-label">Date</label>
      <input type="date" name="date" class="form-control" value="{{ today }}">
    </div>
    <div class="col-md-5">
      <label class="form-label">Supplier Invoice No</label>
      <input type="text" name="invoice_no" class="form-control">
    </div>
  </div>

  <h5>Items</h5>
  <table class="table" id="itemsTable">
    <thead><tr><th>Product</th><th style="width:120px">Qty</th><th style="width:160px">Purchase Price (each)</th><th></th></tr></thead>
    <tbody>
      <tr>
        <td>
          <select name="product_id[]" class="form-select">
            <option value="">-- Select Product --</option>
            {% for p in products %}
            <option value="{{ p.id }}">{{ p.part_no }} - {{ p.product_name }}</option>
            {% endfor %}
          </select>
        </td>
        <td><input type="number" name="qty[]" class="form-control" min="1"></td>
        <td><input type="number" step="0.01" name="purchase_price[]" class="form-control"></td>
        <td><button type="button" class="btn btn-outline-danger btn-sm remove-row">×</button></td>
      </tr>
    </tbody>
  </table>
  <button type="button" id="addRow" class="btn btn-sm btn-outline-primary mb-3">+ Add Line</button>

  <div class="mt-3 d-flex gap-2">
    <button type="submit" class="btn btn-primary">Save Purchase</button>
    <a href="{{ url_for('purchases.list_purchases') }}" class="btn btn-outline-secondary">Cancel</a>
  </div>
</form>

<script>
document.getElementById('addRow').addEventListener('click', function () {
  const tbody = document.querySelector('#itemsTable tbody');
  const newRow = tbody.rows[0].cloneNode(true);
  newRow.querySelectorAll('input').forEach(el => el.value = '');
  newRow.querySelector('select').selectedIndex = 0;
  tbody.appendChild(newRow);
});

document.querySelector('#itemsTable').addEventListener('click', function (e) {
  if (e.target.classList.contains('remove-row')) {
    const tbody = document.querySelector('#itemsTable tbody');
    if (tbody.rows.length > 1) {
      e.target.closest('tr').remove();
    }
  }
});
</script>
{% endblock %}
