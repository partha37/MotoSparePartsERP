{% extends "base.html" %}
{% block title %}{{ 'Edit' if supplier else 'Add' }} Supplier - MotoSpareParts ERP{% endblock %}
{% block content %}
<h2 class="mb-4">{{ 'Edit' if supplier else 'Add' }} Supplier</h2>
<form method="post" class="card p-4">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label">Name</label>
      <input type="text" name="name" class="form-control" required value="{{ supplier.name if supplier else '' }}">
    </div>
    <div class="col-md-6">
      <label class="form-label">Brand</label>
      <input type="text" name="brand" class="form-control" placeholder="Honda / TVS / Bajaj" value="{{ supplier.brand if supplier else '' }}">
    </div>
    <div class="col-md-4">
      <label class="form-label">Phone</label>
      <input type="text" name="phone" class="form-control" value="{{ supplier.phone if supplier else '' }}">
    </div>
    <div class="col-md-4">
      <label class="form-label">GSTIN</label>
      <input type="text" name="gstin" class="form-control" value="{{ supplier.gstin if supplier else '' }}">
    </div>
    <div class="col-md-12">
      <label class="form-label">Address</label>
      <textarea name="address" class="form-control">{{ supplier.address if supplier else '' }}</textarea>
    </div>
  </div>
  <div class="mt-4 d-flex gap-2">
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{{ url_for('suppliers.list_suppliers') }}" class="btn btn-outline-secondary">Cancel</a>
  </div>
</form>
{% endblock %}
